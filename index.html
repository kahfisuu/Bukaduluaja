<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun Nisa!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    #background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    h1 {
      font-size: 3em;
      margin-top: 60px;
      color: #fff;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 20px auto;
      color: #fff;
    }
    .typing {
      display: inline-block;
      border-right: 3px solid #fff;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 4s steps(40) 1s 1 normal both, blinkCaret 0.75s step-end infinite;
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blinkCaret {
      from, to { border-color: transparent; }
      50% { border-color: #fff; }
    }
    .countdown {
      font-size: 2em;
      color: #fff;
      margin-top: 30px;
      font-weight: bold;
    }
    button {
      background-color: #ff6f61;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      background-color: #ff856b;
    }
    .message {
      display: none;
      margin-top: 30px;
      font-size: 1.4em;
      font-weight: bold;
      color: #fff;
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <video id="background-video" autoplay muted loop>
    <source src="video.mov" type="video/mp4">
    Browser Anda tidak mendukung elemen video.
  </video>

  <canvas id="confetti"></canvas>

  <h1>Selamat Ulang Tahun, Nisa! 🎂</h1>
  <p class="typing">Hari ini adalah tentang kamu. Semoga dunia selalu tersenyum padamu, seperti kamu menyebar senyum pada dunia!</p>

  <div class="countdown" id="countdown"></div>

  <button onclick="showMessage()">Lihat Ucapan Spesial 🎁</button>

  <div class="message" id="specialMessage">
    Dek Nijul, semoga hidupmu selalu dipenuhi kebahagiaan, kesuksesan, dan cinta dari orang-orang tercinta. Teruslah bersinar dan jangan lupa bahagia! 🌟
  </div>

  <audio id="music" src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" loop></audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function showMessage() {
      document.getElementById('specialMessage').style.display = 'block';
      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });
      const music = document.getElementById('music');
      music.play().catch(() => {
        alert("Klik layar untuk mengaktifkan musik 🎶");
      });
    }
    function startCountdown() {
      const targetDate = new Date("2026-05-02T00:00:00");
      const countdownElement = document.getElementById("countdown");
      function updateCountdown() {
        const now = new Date();
        const timeDifference = targetDate - now;
        const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);
        countdownElement.innerHTML = `${days} Hari ${hours} Jam ${minutes} Menit ${seconds} Detik`;
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);
    }
    startCountdown();
  </script>

</body>
</html>
